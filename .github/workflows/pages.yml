name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # A 404.html usa caminhos a partir de "/" (certo no domínio final).
      # No Pages o site fica em /site_spazio61, então o prefixo entra só na publicação.
      - name: Ajusta caminhos da 404 ao endereço do Pages
        env:
          BASE: ${{ steps.pages.outputs.base_path }}
        run: sed -i -E "s#(href|src)=\"/#=\"${BASE}/#g" site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@v4
